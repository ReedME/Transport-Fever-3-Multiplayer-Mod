name: server image

# Publishes the server's container image to the GitHub container registry
# when a release is published, as ghcr.io/<owner>/tpf3mp-server:<version>
# and :latest, so a server upgrades with `docker compose pull` instead of
# compiling (docs/OPERATIONS.md, "Upgrades"). Run it by hand to publish the
# image of a branch under its name, for a test server.
on:
  release:
    types: [published]
  push:
    # This candidate publishes only its branch tag, never :latest.
    branches: [codex/proton-competitive-fixes]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: publish the server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: name
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/tpf3mp-server"
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::the release tag $TAG is not v<version>"
              exit 1
            fi
            tags="$image:$version,$image:latest"
          else
            # A branch's image, never :latest.
            tags="$image:branch-${BRANCH//[^A-Za-z0-9._-]/-}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The TPF3-MP dedicated server
            org.opencontainers.image.licenses=MIT
