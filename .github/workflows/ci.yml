name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The three platforms players mix in one room.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The installer is scripts players can read (docs/DECISIONS.md, D9),
      # tested as players run them: Windows PowerShell 5.1 on Windows, and
      # the bash 3.2 macOS ships.
      - name: Installer scripts
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/tests/test-install.ps1 ;;
            macOS) BASH_TO_TEST=/bin/bash /bin/bash packaging/unix/test-install.sh ;;
            *) bash packaging/unix/test-install.sh ;;
          esac
      - name: Game helper scripts (no game required)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/game/test-tools.ps1
      - name: Private game archive selection (no game required)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/github/test-select-game-archive.ps1
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # Scenario failures must include the first connection/load fault,
          # rather than only the eventual exhausted-rejoin summary.
          TPF3MP_TEST_TRACE: warn,tpf3mp_agent=debug,tpf3mp_server=debug

  release-build:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # What the release workflow packages, built as it builds it, so an
      # optimized or link-time problem shows before a release is tagged.
      - run: cargo build --release --locked -p tpf3mp-launcher -p tpf3mp-agent -p tpf3mp-server -p tpf3mp-hook
      - name: The binaries start
        shell: bash
        run: |
          # The launcher is a windowed program: on Windows it prints nothing,
          # but must still exit cleanly.
          ./target/release/tpf3mp-launcher --version
          ./target/release/tpf3mp-agent --version
          ./target/release/tpf3mp-server --version

  tpfre:
    name: tpfre
    # The release-day binary-analysis kit (tools/tpfre) is its own Cargo
    # workspace and runs on developers' machines only: Linux is enough.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tpfre
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/tpfre
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  dayone:
    name: release-day tools
    # tools/dayone/dayone.py and the TF3 probe mods' Lua (docs/DAY_ONE.md):
    # Python and a real Lua, on Linux, where they run as on the players'.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/dayone/test_dayone.py
      - run: python tools/lobby/test_make_main_page.py
      - run: python tools/test_lane_diff.py
      - run: pip install lupa==2.8 && python tools/probe/check_lua.py
      - run: python tools/probe/test_tf3_detprobe.py
      - run: python tools/probe/test_compare_runs.py
      # The Discord release announcement (announce.yml).
      - run: python tools/github/test_announce_release.py
      - run: python tools/github/test_release_server_validation.py
      - run: python tools/github/test_verify_game_build.py
      - run: python tools/github/test_setup_update_key.py

  page:
    name: launcher page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The page's script runs only in a browser, which no test drives; a
      # syntax error there leaves the launcher a dead page. It must parse.
      - name: The launcher page's script parses
        run: |
          python3 - <<'EOF'
          import re
          page = open("crates/tpf3mp-agent/src/launcher/page.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", page, re.S)
          assert scripts, "the page has no script"
          open("page.js", "w", encoding="utf-8").write(chr(10).join(scripts))
          EOF
          node --check page.js

  image:
    name: server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        run: docker buildx build --file deploy/Dockerfile --tag tpf3mp-server:ci --load .
      - name: The image starts and serves the admin endpoint
        run: |
          mkdir -p /tmp/tpf3mp && chmod 0777 /tmp/tpf3mp
          docker run -d --name tpf3mp --read-only --cap-drop ALL \
            -p 127.0.0.1:9470:9470 -v /tmp/tpf3mp:/data tpf3mp-server:ci \
            --listen 0.0.0.0:29470 --dev-self-signed /data/dev.der \
            --secret-file /data/invite.key --admin-listen 0.0.0.0:9470 \
            --tunnel-listen 0.0.0.0:29471 --tunnel-behind-proxy
          for attempt in $(seq 1 20); do
            curl -sf http://127.0.0.1:9470/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9470/metrics | grep tpf3mp_sessions
          curl -sf http://127.0.0.1:9470/metrics | grep tpf3mp_tunnels
          docker logs tpf3mp
          docker logs tpf3mp 2>&1 | grep "accepting tunnels"
      - name: The compose setup runs, and collect-logs.sh gathers its logs
        run: |
          docker rm -f tpf3mp
          cd deploy
          # The deployment as it is, with a throwaway certificate in place
          # of the real one and JSON logs.
          cat > compose.ci.yaml <<'EOF'
          services:
            tpf3mp-server:
              image: tpf3mp-server:ci
              environment:
                TPF3MP_LOG_FORMAT: json
              command: ["--listen", "0.0.0.0:29470", "--dev-self-signed", "/data/dev.der",
                        "--secret-file", "/data/invite.key", "--data-dir", "/data/rooms",
                        "--admin-listen", "0.0.0.0:9470"]
          EOF
          export COMPOSE_FILE=compose.yaml:compose.ci.yaml
          # Its own project, whatever the folder: never the `deploy` project
          # of another service on the host (docs/OPERATIONS.md).
          test "$(docker compose config --format json | jq -r .name)" = tpf3mp
          docker compose up -d --no-build
          for attempt in $(seq 1 20); do
            curl -sf http://127.0.0.1:9470/healthz && break
            sleep 1
          done
          ./collect-logs.sh --since 10m
          bundle=$(ls tpf3mp-logs-*.tar.gz)
          tar -tzf "$bundle"
          tar -xzf "$bundle"
          grep '"message":"listening"' tpf3mp-logs-*/server.log
          grep tpf3mp_sessions tpf3mp-logs-*/metrics.txt
          grep 'status=running' tpf3mp-logs-*/state.txt
          ./collect-logs.sh --since 10m --for no-such-session
          docker compose down -v
      - name: The developers' controller refuses all it does not offer
        run: |
          set -u
          ctl=deploy/host/tpf3mp-ctl
          refused() { # WHAT... : the controller must say no, and run nothing
            if output=$(sh "$ctl" "$@" 2>&1); then
              echo "accepted: $*"; exit 1
            fi
            echo "refused: $* -> $output"
          }
          refused ls /
          refused cat /etc/passwd
          refused 'status;' id
          refused status now
          refused logs --since '$(id)'
          refused logs --since 5x
          refused logs --tail -1
          refused logs --until 2h
          refused diagnostics ../../etc/passwd
          refused diagnostics K7QM2X extra
          refused diagnostics K7QM2X 'hook&source=game'
          refused diagnostics K7QM2X hook extra
          refused diagnostics K7QM2X dmp
          refused diagnostics --name
          refused diagnostics --name 'ann&player=x'
          refused diagnostics --name 'a;id'
          refused diagnostics --name "$(printf 'x\nann')"
          refused diagnostics --name ann extra
          refused diagnostics --player p-12
          refused diagnostics --player "$(printf 'p-3f2a91c0d4e5b6a7\nx')"
          refused diagnostics K7QM2
          refused diagnostics K7QM2XA
          refused diagnostics 'K7QM2X/../../metrics'
          refused diagnostics "$(printf 'x\nK7QM2X')"
          refused diagnostics K7QM0X
          refused metrics now
          refused deploy main
          refused deploy 'HEAD~1'
          refused deploy 0123456 extra
          sh "$ctl" help | grep -q deploy
          sh -n deploy/host/tpf3mp-dev-shell deploy/host/tpf3mp-add-dev deploy/host/install.sh
      - name: The certbot hook hands over TPF3-MP's certificate alone
        run: |
          set -eu
          work=$(mktemp -d)
          mkdir -p "$work/live/tpf3mp.test" "$work/live/other.test" "$work/deploy"
          for lineage in tpf3mp.test other.test; do
            for file in fullchain.pem privkey.pem; do
              echo "$lineage $file" > "$work/live/$lineage/$file"
            done
          done
          sed -e "s|^HOST=.*|HOST=tpf3mp.test|" -e "s|^DEPLOY=.*|DEPLOY=$work/deploy|" \
            deploy/certbot-deploy-hook.sh > "$work/hook.sh"
          # Another site's renewal: nothing happens.
          sudo RENEWED_LINEAGE="$work/live/other.test" sh "$work/hook.sh"
          test ! -e "$work/deploy/certs/fullchain.pem"
          # TPF3-MP's: copied, readable by the image's user alone.
          sudo RENEWED_LINEAGE="$work/live/tpf3mp.test" sh "$work/hook.sh"
          for file in fullchain.pem privkey.pem; do
            test "$(sudo stat -c '%u:%g %a' "$work/deploy/certs/$file")" = "65532:65532 440"
            sudo grep -qx "tpf3mp.test $file" "$work/deploy/certs/$file"
          done
